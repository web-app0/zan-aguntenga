<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zan Aguntenga - Personal Barbershop Booking</title>
  
  <!-- SEO & Social Sharing Metadata -->
  <meta name="description" content="Sistem Reservasi & Booking Jadwal Potong Rambut Pribadi - Zan Aguntenga Personal Barbershop.">
  <meta name="theme-color" content="#1A1A1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zan Aguntenga">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Zan Aguntenga - Personal Barbershop">
  <meta property="og:description" content="Pesan jadwal potong rambut tanpa antre bersama barber profesional pribadi Anda.">
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Container Layar Penuh */
    #appWrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Iframe Google Apps Script */
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      flex: 1;
      background: #F8F7F4;
    }

    /* Layar Loading / Splash Screen */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1A1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: #FFFFFF;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .brand-logo-box {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #2A2A2A, #141414);
      border: 2px solid #D4AF37;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
      animation: pulseBrand 2s infinite ease-in-out;
    }

    .brand-logo-box svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #D4AF37;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #A0A0A0;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }

    /* Spinner Animasi */
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Tombol Bantuan jika Koneksi Lambat */
    .fallback-btn {
      margin-top: 24px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #D4AF37;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      display: none;
      transition: all 0.2s ease;
    }

    .fallback-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: #D4AF37;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseBrand {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- Layar Splash Screen / Loading Elegan -->
  <div id="splashScreen">
    <div class="brand-logo-box">
      <!-- Ikon Gunting Barbershop -->
      <svg viewBox="0 0 24 24">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
      </svg>
    </div>
    <div class="brand-title">Zan Aguntenga</div>
    <div class="brand-subtitle">Personal Barbershop Experience</div>
    <div class="spinner" id="spinnerIndicator"></div>
    <a href="https://script.google.com/macros/s/AKfycbznAKnKQOLpb2V_ZXaoP7jMs3TMk9MGE-_QX5S2qcfFUcaiWNxjfG6Yz6JdmOg4VSEPCA/exec" target="_blank" class="fallback-btn" id="fallbackBtn">Buka Langsung di Tab Baru</a>
  </div>

  <!-- Pembungkus Iframe Web App -->
  <div id="appWrapper">
    <iframe 
      id="appFrame" 
      src="https://script.google.com/macros/s/AKfycbznAKnKQOLpb2V_ZXaoP7jMs3TMk9MGE-_QX5S2qcfFUcaiWNxjfG6Yz6JdmOg4VSEPCA/exec"
      allow="geolocation; camera; microphone; clipboard-write;"
      loading="eager"
      title="Zan Aguntenga Barbershop App">
    </iframe>
  </div>

  <script>
    const iframe = document.getElementById('appFrame');
    const splash = document.getElementById('splashScreen');
    const fallbackBtn = document.getElementById('fallbackBtn');

    // Sembunyikan Splash Screen setelah iframe selesai dimuat
    iframe.onload = function() {
      setTimeout(function() {
        splash.style.opacity = '0';
        setTimeout(function() {
          splash.style.display = 'none';
        }, 500);
      }, 400);
    };

    // Tampilkan tombol bantuan jika dalam 8 detik belum selesai memuat
    setTimeout(function() {
      if (splash.style.display !== 'none') {
        fallbackBtn.style.display = 'inline-block';
      }
    }, 8000);
  </script>

</body>
</html>
